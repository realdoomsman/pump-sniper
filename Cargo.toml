[package]
name = "sniper"
version = "0.1.0"
edition = "2021"
description = "pump.fun bonding-curve completion sniper"

[lib]
name = "sniper"
path = "src/lib.rs"

[[bin]]
name = "sniper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bs58 = "0.5"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
rand = "0.8"
solana-sdk = "4"
# solana-keypair 3.x needs five8's std feature for its Error impl;
# five8 1.0 removed it, so pin the 0.2 line.
five8 = { version = "0.2.1", features = ["std"] }
bincode = "1.3"
solana-compute-budget-interface = "3.1.0"
solana-address-lookup-table-interface = { version = "3.2.0", features = ["bincode", "bytemuck"] }
solana-system-interface = { version = "3.3.0", features = ["bincode"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
